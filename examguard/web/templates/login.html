<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExamGuard sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark"></span> ExamGuard</div>
    <h1>{{ room }}</h1>
    <p class="muted">Teacher sign-in. Your name is recorded next to every decision you make.</p>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Your name
        <input name="name" autocomplete="name" required autofocus maxlength="60">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
