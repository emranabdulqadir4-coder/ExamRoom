# Example Mosquitto configuration for ExamGuard's edge box <-> server link.
# UNTESTED: written from Mosquitto's documentation, never run with ExamGuard. Check it with `mosquitto -c ... -v`.
#
# 1. Install Mosquitto on ONE computer on the school network (often the server computer): https://mosquitto.org
# 2. Create the two users (you will be asked for a password for each):
#        mosquitto_passwd -c deploy/passwords edge
#        mosquitto_passwd    deploy/passwords server
# 3. Start it:   mosquitto -c deploy/mosquitto.conf
# 4. Put the broker's address, and each computer's own user and password, in each computer's .env
#    (see .env.example). EXAMGUARD_MQTT_KEY must be the SAME on both.

listener 1883
allow_anonymous false
password_file deploy/passwords
acl_file deploy/acl

# Keep queued alerts and the retained seat map when the broker restarts.
persistence true
persistence_location deploy/data/

# For TLS (recommended on Wi-Fi) replace the listener above with:
#   listener 8883
#   cafile   deploy/ca.crt
#   certfile deploy/server.crt
#   keyfile  deploy/server.key
# and set EXAMGUARD_MQTT_TLS=true (and EXAMGUARD_MQTT_CAFILE=... for a private certificate) on both computers.
